<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-TGpDV7u8NjNl/accJpRReNRotfOjLmXl0u7wrPiz+VyB+QSH6Zx7FLt3Phhh5Iay"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Your HTML Page</title>
  </head>
  <body>
    <style>
      body {
        font-family:
          "-apple-system, BlinkMacSystemFont", "Segoe UI", "Roboto",
          "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      .flex {
        display: flex;
      }
      .material-symbols-outlined {
        color: #006fd6;
        font-size: 16px;
        float: right;
      }
      .box {
        padding: 8px 20px 8px 20px;
        border-radius: 4px;
        background: #eeeff9;
        margin-top: 15px;
      }
    </style>
    <div style="width: 100%; padding: 0 0 0 10px">
      <div class="flex list" style="margin: 20px 0 20px 0; width: 100%">
        <div style="display: flex; width: 100%; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <div>
              <div style="color: #637381; font-size: 11px; padding-bottom: 5px">
                Plan Name
              </div>
            </div>
            <div
              style="
                font-size: 13px;
                color: #454F5B;
                padding-bottom: 5px;
              "
            >
              Imperial Medi-Care Plan
            </div>
          </div>
        </div>
      </div>

      <div class="flex list" style="margin-bottom: 20px; width: 100%">
        <div style="display: flex; width: 100%; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <div>
              <div style="color: #637381; font-size: 11px; padding-bottom: 5px">
                Sum Assured
              </div>
            </div>
            <div
              style="
                font-size: 13px;
                color: #454F5B;
                padding-bottom: 5px;
              "
            >
              $1000
            </div>
          </div>
        </div>
      </div>
      <div class="flex list" style="margin-bottom: 20px; width: 100%">
        <div style="display: flex; width: 100%; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <div>
              <div style="color: #637381; font-size: 11px; padding-bottom: 5px">
                Coverage
              </div>
            </div>
            <div
              style="
                font-size: 13px;
                color: #454F5B;
                padding-bottom: 5px;
              "
            >
              Till 01.11.2026
            </div>
          </div>
        </div>
        <div
          style="
            background: #d3f8e0;
            color: #13803d;
            font-size: 12px;
            padding: 2px 12px;
            font-weight: 400;
            display: flex;
            justify-content: center;
            align-items: center;
            vertical-align: middle;
            border-radius: 20px;
            margin-right: 15px;
            height: 22px;
            width: 53px;
          "
        >
          Active
        </div>
      </div>
      <div class="flex list" style="margin-bottom: 20px; width: 100%">
        <div style="display: flex; width: 100%; justify-content: space-between">
          <div style="display: flex; flex-direction: column">
            <div>
              <div style="color: #637381; font-size: 11px; padding-bottom: 5px">
                Cover Type
              </div>
            </div>
            <div
              style="
                font-size: 13px;
                color: #454F5B;
                padding-bottom: 5px;
              "
            >
              Self, Spouse, 2 Kids, Parents
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-eOJdFpSO8LVDFsMfuJ3vbqEGTiERdkz5KpSi4LXqATKxLqjBAarFfGjG92yZ9EG"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
